<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Probe LSH Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 2rem; }
        .header { text-align: center; margin-bottom: 2rem; border-bottom: 1px solid #334155; padding-bottom: 1rem; }
        .header h1 { margin: 0; color: #38bdf8; font-size: 2.5rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .card { background: #1e293b; padding: 1.5rem; border-radius: 12px; border: 1px solid #334155; }
        .card h3 { margin-top: 0; color: #94a3b8; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .card .value { font-size: 2.5rem; font-weight: bold; color: #fff; margin: 0.5rem 0; }
        .card .highlight { color: #10b981; }
        .chart-container { background: #1e293b; padding: 1.5rem; border-radius: 12px; border: 1px solid #334155; margin-top: 2rem; }
        canvas { max-height: 400px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Multi-Probe LSH Telemetry (K=8)</h1>
        <p>OpenMP Parallel Batch Validation on INRIA SIFT10K</p>
    </div>
    <div class="grid">
        <div class="card">
            <h3>Index RAM Reduction</h3>
            <div class="value highlight" id="ram-reduction">--%</div>
            <p style="color: #94a3b8; margin: 0; font-size: 0.9rem;">From <span id="ram-classic">--</span> MB to <span id="ram-compact">--</span> MB</p>
        </div>
        <div class="card">
            <h3>Multi-Probe Recall@10</h3>
            <div class="value highlight" id="recall-mp">--%</div>
        </div>
        <div class="card">
            <h3>Candidate Fraction Scanned</h3>
            <div class="value" id="frac-mp">--%</div>
            <p style="color: #94a3b8; margin: 0; font-size: 0.9rem;">Algorithmic work reduction</p>
        </div>
        <div class="card">
            <h3>OpenMP Batch Throughput</h3>
            <div class="value" id="bf-qps">-- QPS</div>
        </div>
    </div>
    <div class="chart-container"><canvas id="latencyChart"></canvas></div>
    <script>
        fetch('./benchmarks/results.json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('ram-reduction').innerText = data.memory.reduction_pct.toFixed(1) + '%';
                document.getElementById('ram-classic').innerText = data.memory.classic_mb.toFixed(2);
                document.getElementById('ram-compact').innerText = data.memory.compact_mb.toFixed(2);
                document.getElementById('recall-mp').innerText = (data.multiprobe_lsh.recall * 100).toFixed(1) + '%';
                document.getElementById('frac-mp').innerText = (data.multiprobe_lsh.frac * 100).toFixed(2) + '%';
                document.getElementById('bf-qps').innerText = Math.round(data.multiprobe_lsh.qps).toLocaleString();

                new Chart(document.getElementById('latencyChart'), {
                    type: 'bar',
                    data: {
                        labels: ['Exact Brute-Force', 'Classic LSH (L=32)', 'Multi-Probe LSH (L=6)'],
                        datasets: [
                            { label: 'Avg Latency (µs)', data: [data.brute_force.avg_us, data.classic_lsh.avg_us, data.multiprobe_lsh.avg_us], backgroundColor: '#38bdf8' },
                            { label: 'p99 Latency (µs)', data: [data.brute_force.p99_us, data.classic_lsh.p99_us, data.multiprobe_lsh.p99_us], backgroundColor: '#f43f5e' }
                        ]
                    },
                    options: { responsive: true, plugins: { legend: { labels: { color: '#fff' } }, title: { display: true, text: 'Query Latency Comparison (Lower is Better)', color: '#fff' } }, scales: { y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }, x: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } } } }
                });
            }).catch(e => console.error(e));
    </script>
</body>
</html>
